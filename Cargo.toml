[package]
name = "overdosecd"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A smart directory and project jumper for the terminal"
license = "MIT"
repository = "https://github.com/Dead-Abyss/overdosecd"
readme = "README.md"
keywords = ["cli", "cd", "jump", "projects"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3"
fd-lock = "4"
fuzzy-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2"
# Pinned deliberately: bincode is unmaintained, and 3.0.0 is a compiled
# `compile_error!` published only to say so (no further releases will come).
# 1.3.3 stays as the fixture oracle for the zoxide parser; do not bump.
bincode = "=1.3.3"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
fd-lock = "4"
predicates = "3"
tempfile = "3"
# `setsid` for the picker's no-terminal test: spawn the binary in a fresh
# session so /dev/tty is unavailable even when the suite runs in a terminal.
libc = "0.2"

[[bench]]
name = "cli"
harness = false

[profile.release]
lto = true
strip = true
