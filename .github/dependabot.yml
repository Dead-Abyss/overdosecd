version: 2
updates:
  # Cargo dependencies and the lockfile, one grouped PR per week.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  # Workflow actions are pinned to SHAs in the workflows; this keeps them
  # moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
