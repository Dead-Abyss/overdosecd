version: 2
updates:
  # Cargo dependencies and the lockfile, one grouped PR per week.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Pre-1.0 crates treat a *minor* bump as breaking (ratatui 0.30 -> 0.31,
      # rusqlite 0.42 -> 0.43), so the direct 0.x dependencies get their own
      # PR instead of riding along with a week of additive updates. Dependabot
      # assigns the first matching group, so 0.x -> 1.0+ bumps land here too;
      # `cargo-major` covers the post-1.0 crates' true majors.
      cargo-breaking-pre1:
        patterns:
          - "chrono"
          - "criterion"
          - "fuzzy-matcher"
          - "libc"
          - "ratatui*"
          - "rusqlite"
          - "unicode-width"
        update-types: ["minor", "major"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
      cargo:
        patterns: ["*"]
    ignore:
      # bincode is pinned at =1.3.3 on purpose: 3.0.0 is a lone
      # `compile_error!` release (see the Cargo.toml comment). Nothing newer
      # compiles, so the bump is never wanted.
      - dependency-name: bincode
        versions: [">=2"]

  # Workflow actions are pinned to SHAs in the workflows; this keeps them
  # moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
