[package]
name = "overdosecd"
version = "0.4.4"
edition = "2024"
rust-version = "1.100"
description = "A smart directory and project jumper for the terminal"
license = "MIT"
repository = "https://github.com/Dead-Abyss/overdosecd"
readme = "README.md"
keywords = ["cli", "cd", "jump", "projects"]
categories = ["command-line-utilities"]
# `cargo install` needs the binary, its README, and the changes; the test
# suite, scripts, and CI files are repository material only. `benches/` stays
# because the manifest declares that target.
exclude = ["/tests", "/scripts", "/.github", "/.opencodereview", "/deny.toml", "/AGENTS.md", "/plan.md"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
fuzzy-matcher = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook-registry = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2.2"

# The crate is Linux-only; `flock(2)` for the cd hook's visit counter is the
# one libc call in the runtime path (tests also use it for `setsid`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
# Pinned deliberately: bincode is unmaintained, and 3.0.0 is a compiled
# `compile_error!` published only to say so (no further releases will come).
# 1.3.3 stays as the fixture oracle for the zoxide parser; do not bump.
bincode = "=1.3.3"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
predicates = "3"
tempfile = "3"

[[bench]]
name = "cli"
harness = false

[profile.release]
lto = true
strip = true
