version: 2
updates:
  # Cargo dependencies and the lockfile, one grouped PR per week.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Breaking bumps get their own PR: one breaking bump must not drag a
      # week of patch updates into a branch that then cannot merge cleanly.
      # Pre-1.0 crates count as breaking on a *minor* bump (0.30 -> 0.31 is
      # ratatui's breaking release), so the direct 0.x dependencies are listed
      # explicitly; the generic major group catches true 0.x -> 1.0+ bumps.
      cargo-breaking-direct:
        patterns:
          - "clap*"
          - "colored"
          - "criterion"
          - "fuzzy-matcher"
          - "ratatui*"
          - "rusqlite"
          - "toml"
        update-types: ["minor", "major"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
      cargo:
        patterns: ["*"]
    ignore:
      # bincode is pinned at =1.3.3 on purpose: 3.0.0 is a lone
      # `compile_error!` release (see the Cargo.toml comment). Nothing newer
      # compiles, so the bump is never wanted.
      - dependency-name: bincode
        versions: [">=2"]

  # Workflow actions are pinned to SHAs in the workflows; this keeps them
  # moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
