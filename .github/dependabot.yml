version: 2
updates:
  # Cargo dependencies and the lockfile, one grouped PR per week.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # bincode is pinned at =1.3.3 on purpose: 3.0.0 is a lone
      # `compile_error!` release (see the Cargo.toml comment). Nothing newer
      # compiles, so the bump is never wanted.
      - dependency-name: bincode
        versions: [">=2"]

  # Workflow actions are pinned to SHAs in the workflows; this keeps them
  # moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
